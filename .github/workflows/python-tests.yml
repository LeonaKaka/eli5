name: Python course project tests

on:
  push:
    branches: [main]
    paths:
      - "projects/research-agent-lite/**"
      - ".github/workflows/python-tests.yml"
  pull_request:
    paths:
      - "projects/research-agent-lite/**"
      - ".github/workflows/python-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/research-agent-lite
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/research-agent-lite/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Smoke run
        run: python -m app.main "RAG evaluation" --top-k 3
