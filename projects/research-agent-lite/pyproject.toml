[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant-eli5"
version = "6.2.0"
description = "Provider-neutral Research Assistant built across ELI5 Python, LLM, RAG, Agent, LangGraph, FastAPI and MCP engineering courses"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "langchain>=1.3,<2",
  "langgraph>=1.2,<2",
  "fastapi[standard]>=0.141,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
